version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Vancouver
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps(actions)
    groups:
      action-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:15"
      timezone: America/Vancouver
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: deps(python)
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: America/Vancouver
    open-pull-requests-limit: 3
    versioning-strategy: increase
    labels:
      - dependencies
    commit-message:
      prefix: deps(docs)
    groups:
      docs-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /.devcontainer
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: America/Vancouver
    open-pull-requests-limit: 2
    labels:
      - dependencies
    commit-message:
      prefix: deps(container)
