name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  CTEST_PARALLEL_LEVEL: "2"
  CTEST_OUTPUT_ON_FAILURE: "1"

jobs:
  quality:
    name: Format and static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            docs/requirements.txt

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang-format \
            clang-tidy \
            cmake \
            cppcheck \
            ninja-build \
            shellcheck
          python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Validate repository files
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Run clang-tidy
        env:
          CC: clang
          CXX: clang++
        run: make tidy

      - name: Run Cppcheck
        run: make cppcheck

  host:
    name: ${{ matrix.name }} host build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            ninja-build
          python -m pip install --disable-pip-version-check --requirement requirements-dev.txt
          conan profile detect --force

      - name: Build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make build PRESET=ci

      - name: Test
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: make test PRESET=ci

  sanitizers:
    name: AddressSanitizer and UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            ninja-build

      - name: Build and test with sanitizers
        env:
          CC: clang
          CXX: clang++
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make sanitize

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install coverage tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            ninja-build
          python -m pip install --disable-pip-version-check --requirement requirements-dev.txt

      - name: Build, test, and report coverage
        env:
          CC: gcc
          CXX: g++
        run: make coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/coverage
          if-no-files-found: error
          retention-days: 14

  cross:
    name: ${{ matrix.name }} cross build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ARM64
            target: cross-arm64
            preset: arm64-release
            emulator: qemu-aarch64
            sysroot: /usr/aarch64-linux-gnu
          - name: ARMv7 hard-float
            target: cross-armv7
            preset: armv7-release
            emulator: qemu-arm
            sysroot: /usr/arm-linux-gnueabihf
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            g++-aarch64-linux-gnu \
            g++-arm-linux-gnueabihf \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabihf \
            ninja-build \
            qemu-user

      - name: Cross-build and package
        run: make "${{ matrix.target }}"

      - name: Smoke-test target executable under QEMU
        run: |
          "${{ matrix.emulator }}" \
            -L "${{ matrix.sysroot }}" \
            "build/${{ matrix.preset }}/bin/embedded-linux-template" \
            --help

      - name: Upload target packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/packages
          if-no-files-found: error
          retention-days: 14

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            docs/requirements.txt

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            doxygen \
            graphviz \
            ninja-build
          python -m pip install \
            --disable-pip-version-check \
            --requirement requirements-dev.txt \
            --requirement docs/requirements.txt

      - name: Build documentation
        run: make docs

      - name: Verify documentation entry point
        run: test -f build/docs/html/index.html

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: build/docs/html
          if-no-files-found: error
          retention-days: 14

  package:
    name: Install and package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            ninja-build

      - name: Create release package
        run: make package

      - name: Stage installation and test a downstream CMake consumer
        run: make consumer-test

      - name: Verify staged installation and packages
        run: |
          test -n "$(find build/release/stage -type f -print -quit)"
          test -n "$(find build/release/packages -type f -print -quit)"

      - name: Upload native package and install tree
        uses: actions/upload-artifact@v7
        with:
          name: packages-release
          path: |
            build/release/packages
            build/release/stage
          if-no-files-found: error
          retention-days: 14
