repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
        types: [file]
        files: '(\.json|\.code-workspace|\.json\.example)$'
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: clang-format-check
        name: clang-format check
        entry: scripts/format.sh --check
        language: system
        pass_filenames: false
        types_or: [c++, c]
      - id: codespell
        name: codespell
        entry: codespell --config .codespellrc .
        language: system
        pass_filenames: false
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
